name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # needed to attach the zip to a release
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      # Unsigned: CI has no signing identity, so the app needs right-click > Open on first launch
      - name: Build
        run: >
          xcodebuild -project huemenubar.xcodeproj -scheme huemenubar -configuration Release
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/huemenubar.app HueMenubar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HueMenubar
          path: HueMenubar.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: HueMenubar.zip
